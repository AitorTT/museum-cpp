<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Museum</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #23272f;
    font-family: system-ui, sans-serif; color: #c8d0dc;
  }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }

  #overlay {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    background: rgba(12, 14, 18, 0.85); cursor: pointer;
  }
  #overlay.hidden { display: none; }
  #overlay-inner { text-align: center; }
  #overlay h1 { font-weight: 600; letter-spacing: 0.08em; font-size: 22px; }
  #overlay p { font-size: 13px; opacity: 0.7; }

  /* Touch controls. Hidden entirely on pointer devices, so the desktop build
     is unchanged. Both sticks are drawn from the same primitives. */
  #touch { display: none; }
  #touch.on { display: block; }

  .stick {
    position: fixed; width: 132px; height: 132px; border-radius: 50%;
    background: rgba(200, 208, 220, 0.10);
    border: 1.5px solid rgba(200, 208, 220, 0.28);
    touch-action: none; z-index: 10;
  }
  .stick .knob {
    position: absolute; width: 58px; height: 58px; border-radius: 50%;
    left: 37px; top: 37px;
    background: rgba(200, 208, 220, 0.34);
    border: 1.5px solid rgba(200, 208, 220, 0.55);
  }
  #stick-move { left: 26px; bottom: 26px; }
  #stick-look { right: 26px; bottom: 26px; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>

<div id="touch">
  <div class="stick" id="stick-move"><div class="knob" id="knob-move"></div></div>
  <div class="stick" id="stick-look"><div class="knob" id="knob-look"></div></div>
</div>

<div id="overlay">
  <div id="overlay-inner">
    <h1>MUSEUM</h1>
    <p id="hint">Click to enter &mdash; WASD to move, mouse to look</p>
  </div>
</div>

<script type="text/javascript">
  // Must exist before the Emscripten runtime script runs, because Emscripten
  // merges its exports into this object.
  var Module = {
    onRuntimeInitialized: function () {
      resizeCanvas();
      _museumStart();
    },
  };

  var canvas = document.getElementById('canvas');
  var overlay = document.getElementById('overlay');
  var hint = document.getElementById('hint');

  // A coarse pointer with no hover is a touch device: phones and tablets. This
  // drives both the controls and the overlay wording, so a desktop browser with
  // a touchscreen still gets the pointer-lock path it expects.
  var isTouch = window.matchMedia &&
      window.matchMedia('(pointer: coarse)').matches;

  // Feature detection can be wrong -- a tablet in desktop mode, a phone with a
  // mouse attached, a browser that reports a fine pointer. Rather than trust it,
  // the first real touch event promotes the page to touch controls. `enableTouch`
  // is idempotent so both paths can call it.
  //
  // A touchscreen laptop reports a fine pointer *and* sends touch events, and
  // for it the mouse is the better control, so the promotion only happens when
  // no fine pointer exists. That is the case the media query gets wrong.
  var hasFinePointer = window.matchMedia &&
      window.matchMedia('(any-pointer: fine)').matches;

  function enableTouch() {
    if (isTouch || hasFinePointer) return;
    isTouch = true;
    hint.textContent =
        'Tap to enter \u2014 left stick to move, right stick to look';
    if (!overlay.classList.contains('hidden')) return;
    document.getElementById('touch').classList.add('on');
    Module.museumSetPointerLocked(true);
  }

  // The C++ platform layer installs these; they defer to the exported symbols.
  Module.museumApplyLook = function (dx, dy) {
    if (Module._museumApplyLook) Module._museumApplyLook(dx, dy);
  };
  Module.museumSetPointerLocked = function (locked) {
    if (Module._museumSetPointerLocked) {
      Module._museumSetPointerLocked(locked ? 1 : 0);
    }
  };
  // Analog move axes, -1..1, with an explicit active flag so the engine can
  // tell a held-but-centred stick from a released one.
  Module.museumSetStick = function (active, forward, strafe) {
    if (Module._museumSetStick) {
      Module._museumSetStick(active ? 1 : 0, forward, strafe);
    }
  };
  // Right-stick look deflection, -1..1. A rate, not a delta: the engine applies
  // it every frame while active.
  Module.museumSetLookStick = function (active, x, y) {
    if (Module._museumSetLookStick) {
      Module._museumSetLookStick(active ? 1 : 0, x, y);
    }
  };

  // Match the drawing buffer to the CSS size and tell the engine, so the
  // WebGPU surface is reconfigured rather than stretched.
  function resizeCanvas() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    if (Module._museumNotifyResize) {
      Module._museumNotifyResize(canvas.width, canvas.height);
    }
  }

  function enterMuseum() {
    overlay.classList.add('hidden');
    if (isTouch) {
      // Pointer lock does not exist for touch, and requesting it would throw.
      // The touch controls take over looking instead.
      document.getElementById('touch').classList.add('on');
      // The engine starts locked-less on touch; nothing else gates movement.
      Module.museumSetPointerLocked(true);
      return;
    }
    // Ignore a rejected lock: the engine still needs to run, and some
    // embedding contexts never grant it.
    var lock = canvas.requestPointerLock();
    if (lock && typeof lock.catch === 'function') {
      lock.catch(function () {});
    }
  }

  // The first real touch anywhere promotes to touch controls, even if the
  // pointer media query said otherwise. Once controls are visible there is
  // nothing else to do, which is what makes enableTouch idempotent.
  window.addEventListener('touchstart', enableTouch, { passive: true });

  overlay.addEventListener('click', enterMuseum);
  overlay.addEventListener('touchend', function (e) {
    e.preventDefault();
    enableTouch();
    enterMuseum();
  });

  document.addEventListener('pointerlockchange', function () {
    if (isTouch) return;
    Module.museumSetPointerLocked(!!document.pointerLockElement);
    if (!document.pointerLockElement) {
      overlay.classList.remove('hidden');
    }
  });

  document.addEventListener('pointermove', function (e) {
    if (isTouch) return;
    if (document.pointerLockElement) {
      Module.museumApplyLook(e.movementX || 0, e.movementY || 0);
    }
  });

  if (isTouch) {
    hint.textContent = 'Tap to enter \u2014 left stick to move, right stick to look';
  }

  // --- Touch controls ------------------------------------------------------

  // Both sticks are the same widget. Each tracks its own touch identifier so a
  // finger on one never drives the other, and each reports through a callback
  // that takes (active, x, y) in -1..1.
  var stickRadius = 66;  // half the 132px pad; matches the CSS
  var kDeadzone = 0.12;

  function makeStick(rootId, knobId, onValue) {
    var root = document.getElementById(rootId);
    var knob = document.getElementById(knobId);
    var touchId = null;

    function origin() {
      var r = root.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }

    function update(t) {
      var o = origin();
      var dx = t.clientX - o.x;
      var dy = t.clientY - o.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      // Clamp the knob to the ring, but keep full deflection when the finger
      // travels past it -- the direction still means something out there.
      var clamp = dist > stickRadius ? stickRadius / dist : 1;
      knob.style.transform =
          'translate(' + (dx * clamp) + 'px,' + (dy * clamp) + 'px)';

      var nx = dx / stickRadius;
      var ny = dy / stickRadius;
      var mag = Math.min(1, Math.sqrt(nx * nx + ny * ny));
      if (mag < kDeadzone) {
        onValue(false, 0, 0);
        return;
      }
      // Screen down (+y) is a negative axis on both sticks: pushing up means
      // forward on the move stick and look-up on the look stick.
      onValue(true, nx, -ny);
    }

    function release() {
      touchId = null;
      knob.style.transform = 'translate(0px,0px)';
      onValue(false, 0, 0);
    }

    root.addEventListener('touchstart', function (e) {
      e.preventDefault();
      if (touchId !== null) return;
      var t = e.changedTouches[0];
      touchId = t.identifier;
      update(t);
    }, { passive: false });

    return {
      owns: function (id) { return id === touchId; },
      // A touch that started on the pad but has strayed: keep tracking it.
      handleMove: function (t) { update(t); },
      release: release,
    };
  }

  var moveStick = makeStick('stick-move', 'knob-move', function (a, x, y) {
    // The engine normalises the vector, so passing the raw axes is safe; x is
    // strafe, y is forward.
    Module.museumSetStick(a, y, x);
  });

  var lookStick = makeStick('stick-look', 'knob-look', function (a, x, y) {
    Module.museumSetLookStick(a, x, y);
  });

  var sticks = [moveStick, lookStick];

  document.addEventListener('touchmove', function (e) {
    var i, s;
    for (i = 0; i < e.changedTouches.length; ++i) {
      var t = e.changedTouches[i];
      for (s = 0; s < sticks.length; ++s) {
        if (sticks[s].owns(t.identifier)) {
          e.preventDefault();
          sticks[s].handleMove(t);
        }
      }
    }
  }, { passive: false });

  function releaseTouches(e) {
    var i, s;
    for (i = 0; i < e.changedTouches.length; ++i) {
      var t = e.changedTouches[i];
      for (s = 0; s < sticks.length; ++s) {
        if (sticks[s].owns(t.identifier)) sticks[s].release();
      }
    }
  }

  document.addEventListener('touchend', releaseTouches);
  document.addEventListener('touchcancel', releaseTouches);

  // DOM code -> index into the C++ table in window_headless.cpp. Passing a
  // number avoids marshalling strings across the WASM boundary every keypress.
  var keyCodes = {
    KeyW: 1, KeyA: 2, KeyS: 3, KeyD: 4, KeyQ: 5, KeyE: 6,
    Space: 7, ShiftLeft: 8, Escape: 9, F1: 10,
    ArrowUp: 11, ArrowDown: 12, ArrowLeft: 13, ArrowRight: 14,
  };

  document.addEventListener('keydown', function (e) {
    var code = keyCodes[e.code];
    if (code && Module._museumKeyCode) {
      Module._museumKeyCode(code, 1);
      e.preventDefault();
    }
  });

  document.addEventListener('keyup', function (e) {
    var code = keyCodes[e.code];
    if (code && Module._museumKeyCode) {
      Module._museumKeyCode(code, 0);
      e.preventDefault();
    }
  });

  window.addEventListener('resize', resizeCanvas);
</script>

{{{ SCRIPT }}}
</body>
</html>
